<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYIT - DS Presentation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-wrapper">

    <header class="site-header">
      <img src="logo.png" alt="College Logo" class="college-logo" />
      <h1 class="site-title">SYIT - DS Presentation</h1>
      <p class="site-subtitle">Register your team for the Data Structures Presentation</p>
    </header>

    
    <main class="form-card">

      <form id="registrationForm" novalidate>

        
        <div class="form-group">
          <label for="section">Select Section <span class="required">*</span></label>
          <select id="section" name="section" required>
            <option value="" disabled selected>Select Section</option>
            <option value="Section A">Section A</option>
            <option value="Section B">Section B</option>
          </select>
        </div>

        
        <div class="form-group hidden" id="teamSizeGroup">
          <label for="teamSize">Select Number of Members <span class="required">*</span></label>
          <select id="teamSize" name="teamSize" required>
            <option value="" disabled selected>Select Number of Members</option>
            <option value="Solo">Solo</option>
            <option value="Five">Five</option>
            <option value="Ten">Ten</option>
          </select>
        </div>

        
        <div id="membersContainer" class="members-container"></div>

        
        <button type="submit" id="submitBtn" class="submit-btn hidden">
          <span class="btn-text">Submit Registration</span>
          <span class="btn-spinner"></span>
        </button>

      </form>

      
      <div id="statusMessage" class="status-message hidden"></div>

    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Department of Information Technology.</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
